<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HelpDesk Lite - Sistema de gestión de tickets de soporte técnico">
    <link rel="stylesheet" href="./css/styles.css">
    <title>HelpDesk Lite</title>
</head>
<body>
    <header class="header">
        <nav class="navbar container">
            <a href="#inicio" class="logo">HelpDesk Lite</a>
                      <a href="#nuevo-ticket" class="button button-primary">+ Nuevo Ticket</a>
        </nav>
    </header>

    <main>
        <section id="inicio" class="dashboard-section container">
            <div class="section-header">
                <span class="section-label">Panel de soporte</span>
                <h1>Tickets de soporte técnico</h1>
            </div>

            <div class="dashboard-grid">
                <article class="dashboard-card">
                    <span class="dashboard-value" id="total-count">0</span>
                    <span class="dashboard-label">Total</span>
                </article>
                <article class="dashboard-card">
                    <span class="dashboard-value" id="nuevos-count">0</span>
                    <span class="dashboard-label">Nuevos</span>
                </article>
                <article class="dashboard-card">
                    <span class="dashboard-value" id="proceso-count">0</span>
                    <span class="dashboard-label">En proceso</span>
                </article>
                <article class="dashboard-card">
                    <span class="dashboard-value" id="resueltos-count">0</span>
                    <span class="dashboard-label">Resueltos</span>
                </article>
            </div>
        </section>
        <section id="nuevo-ticket" class="form-section container">
    <div class="section-header">
        <span class="section-label">Registro</span>
        <h2>Nuevo Ticket</h2>
    </div>

    <form id="ticket-form" class="ticket-form" novalidate>
        <div class="form-group">
            <label for="ticket-title">Título</label>
            <input type="text" id="ticket-title" name="title" placeholder="Ej. Internet caído en laboratorio">
        </div>

        <div class="form-group">
            <label for="ticket-description">Descripción</label>
            <textarea id="ticket-description" name="description" rows="4" placeholder="Describe el problema con el mayor detalle posible"></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="ticket-category">Categoría</label>
                <select id="ticket-category" name="category">
                    <option value="" disabled selected>Selecciona una categoría</option>
                    <option value="Hardware">Hardware</option>
                    <option value="Software">Software</option>
                    <option value="Red">Red</option>
                    <option value="Accesos">Accesos</option>
                    <option value="Correo">Correo</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="ticket-priority">Prioridad</label>
                <select id="ticket-priority" name="priority">
                    <option value="" disabled selected>Selecciona una prioridad</option>
                    <option value="Baja">Baja</option>
                    <option value="Media">Media</option>
                    <option value="Alta">Alta</option>
                    <option value="Crítica">Crítica</option>
                </select>
            </div>
        </div>

        <p class="form-error" id="form-error"></p>

        <button type="submit" class="button button-primary">Crear Ticket</button>
    </form>
</section>
        <section id="tickets" class="tickets-section container">
            <div class="section-header">
                <span class="section-label">Bandeja</span>
                <h2>Tickets registrados</h2>
            </div>

            <div id="tickets-container" class="tickets-grid"></div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p><strong>HelpDesk Lite</strong></p>
            <p>Proyecto Académico - Aplicaciones de Internet</p>
        </div>
    </footer>

    <script src="./js/app.js"></script>
</body>
</html>
